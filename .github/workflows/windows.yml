# The Windows host's portable crates (windows/), on Windows and macOS. Fork-only file: upstream's
# own workflows are untouched.
name: windows

on:
  push:
    branches: ["task/**"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --check
      # The Windows-only code (DPAPI, DnsServiceRegister) compiles here, under cfg(windows); this
      # names it so a failure is plain.
      - name: Windows-only code (sill-platform, sill-store)
        run: cargo clippy -p sill-platform -p sill-store --all-targets --locked -- -D warnings
      - run: cargo build -p sill-host --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sill-host-windows-x64
          path: windows/target/release/sill-host.exe
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable && rustup target add x86_64-pc-windows-msvc
      - run: cargo test --workspace --locked
      # Cross-check of the Windows-only code from macOS (pure Rust crates: no MSVC needed).
      - run: cargo clippy -p sill-platform -p sill-store --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      # R1 (Checkpoint 1): an unpaired key must end as Apple's client reports -9825, which the
      # device reads as "Not paired". tlsprobe dials with the device's own RemoteTLS options.
      - run: cargo build -p sill-host --locked
      - run: swift build -c release --package-path tools/tlsprobe
      - name: tlsprobe against sill-host (unpaired key → -9825 on both doors)
        run: |
          D="$RUNNER_TEMP/sill-probe"
          target/debug/sill-host --data-dir "$D" --name Probe --remote-port 17455 --home-port 17456 --bind 127.0.0.1 --no-bonjour > "$RUNNER_TEMP/host.log" 2>&1 &
          sleep 2
          P=tools/tlsprobe/.build/release/tlsprobe
          $P 127.0.0.1 17455 --expect=revoked
          $P 127.0.0.1 17456 --expect=revoked
          $P 127.0.0.1 17455 --alpn=sill-pair/1 --expect=revoked
          kill %1 || true
          grep Refused "$RUNNER_TEMP/host.log"
