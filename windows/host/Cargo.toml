[package]
name = "sill-host"
version = "0.1.0"
description = "Sill's Windows host: pairing, sessions, the desktop as hardware HEVC (or a test picture)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sill-host"
path = "src/main.rs"

[dependencies]
sill-net = { path = "../crates/sill-net" }
sill-store = { path = "../crates/sill-store" }
sill-pairing = { path = "../crates/sill-pairing" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sill-capture = { path = "../crates/sill-capture" }
sill-encode = { path = "../crates/sill-encode" }
sill-input = { path = "../crates/sill-input" }
sill-wire = { path = "../crates/sill-wire" }
sill-catalog = { path = "../crates/sill-catalog" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
