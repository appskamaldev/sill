[package]
name = "sill-host"
version = "0.1.0"
description = "Sill's Windows host: pairing, sessions, the desktop as hardware HEVC (or a test picture)."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sill-host"
path = "src/main.rs"

[dependencies]
sill-net = { path = "../crates/sill-net" }
sill-store = { path = "../crates/sill-store" }
sill-pairing = { path = "../crates/sill-pairing" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sill-capture = { path = "../crates/sill-capture" }
sill-encode = { path = "../crates/sill-encode" }
