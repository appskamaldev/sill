[workspace]
resolver = "2"
members = [
    "crates/sill-wire",
    "crates/sill-pairing",
    "crates/sill-policy",
    "crates/sill-platform",
    "crates/sill-store",
    "crates/sill-net",
    "host",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
unicode-segmentation = "1"
unicode-general-category = "1"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter", "ansi"] }

# PBKDF2's 600,000 rounds take seconds unoptimised; tests run them, so dependencies build optimised.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.sill-pairing]
opt-level = 3
